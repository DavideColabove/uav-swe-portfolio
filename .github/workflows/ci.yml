name: UAV CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linting:
    name: Formatting & Static Analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Dependencies & Quality Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            clang-tidy \
            ros-humble-rclcpp \
            ros-humble-rclcpp-components \
            ros-humble-sensor-msgs

      - name: Enforce Code Style (clang-format)
        run: find . -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run -Werror

      - name: Static Analysis (clang-tidy)
        run: |
          ROS_INCLUDES=$(find /opt/ros/humble/include -maxdepth 1 -type d | sed 's/^/-I/')
          find 01_cpp_robotics 02_ros2_telemetry \
            -name "*.cpp" \
            -not -path "*/build/*" \
            -not -path "*/install/*" \
            -not -path "*/log/*" | xargs clang-tidy -- \
            -std=c++17 \
            ${ROS_INCLUDES}

  build-test:
    name: Standard Build & Unit Tests
    runs-on: ubuntu-22.04
    needs: linting # Esegue la build solo se il codice è formattato correttamente
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run CTest
        working-directory: ./build
        run: ctest --output-on-failure -j$(nproc)

  sanitizers:
    name: Sanitizer Suite (${{ matrix.sanitizer }})
    runs-on: ubuntu-22.04
    needs: build-test # Evita di sprecare minuti CI se la build standard fallisce
    strategy:
      fail-fast: false
      matrix:
        # Address e UndefinedBehavior possono girare insieme. ThreadSanitizer deve girare da solo.
        sanitizer: ['address,undefined', 'thread']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake with Sanitizers
        # -fno-omit-frame-pointer garantisce stack trace leggibili se il sanitizer trova un bug
        run: cmake -B build -S . -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g -O1"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run CTest with Sanitizers
        working-directory: ./build
        # I sanitizer intercettano automaticamente le violazioni di memoria e i data race durante ctest
        run: ctest --output-on-failure -j$(nproc)