<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter — UAV Software Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════ NAVBAR ═══════ -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        UAV Portfolio
      </a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <!-- Chapters injected by JS -->
      </ul>
    </div>
  </nav>

  <!-- ═══════ CHAPTER HEADER ═══════ -->
  <section class="chapter-header">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">Home</a> / <span id="breadcrumb-title">Chapter</span>
      </div>
      <h1 id="chapter-title"></h1>
      <p id="chapter-desc"></p>
      <div class="card-meta" style="margin-top:1rem">
        <span class="card-tag" id="chapter-status"></span>
        <span class="card-deepdive-count" id="chapter-branch"></span>
      </div>
    </div>
  </section>

  <!-- ═══════ PDF VIEWER (Chapter Summary) ═══════ -->
  <section class="pdf-viewer-section">
    <div class="container">
      <div class="pdf-viewer-wrapper">
        <div class="pdf-toolbar">
          <span>📄 Chapter Summary</span>
          <div class="pdf-toolbar-controls">
            <button onclick="pdfZoomOut()" title="Zoom Out">−</button>
            <button onclick="pdfZoomIn()" title="Zoom In">+</button>
            <button id="pdf-prev" onclick="pdfPrev()" title="Previous Page">◀</button>
            <span id="pdf-page-info" class="pdf-page-info">— / —</span>
            <button id="pdf-next" onclick="pdfNext()" title="Next Page">▶</button>
            <button id="pdf-download" onclick="downloadSummary()" title="Download PDF">⬇ PDF</button>
          </div>
        </div>
        <div id="pdf-canvas-container" class="pdf-canvas-container">
          <div class="pdf-placeholder">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:48px;height:48px;opacity:.4"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
            <p>Loading chapter summary…</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════ DEEP-DIVES LIST ═══════ -->
  <section class="deepdive-section">
    <div class="container">
      <h2>
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
        Deep-Dives
      </h2>
      <div class="deepdive-list" id="deepdive-list">
        <!-- Injected by JS -->
      </div>
    </div>
  </section>

  <!-- ═══════ SOURCE FILES ═══════ -->
  <section class="source-files-section" id="source-section" style="display:none">
    <div class="container">
      <h2>
        <svg viewBox="0 0 24 24" fill="var(--accent)" style="width:24px;height:24px"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        Source Code
      </h2>
      <div id="source-list"></div>
    </div>
  </section>

  <!-- ═══════ CHAPTER NAV ═══════ -->
  <section class="container" style="padding-bottom:3rem;position:relative;z-index:1">
    <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <a id="nav-prev" href="#" class="chapter-card" style="flex:1;min-width:200px;display:none">
        <span class="card-number">← Previous</span>
        <h3 id="nav-prev-title"></h3>
      </a>
      <a id="nav-next" href="#" class="chapter-card" style="flex:1;min-width:200px;text-align:right;display:none">
        <span class="card-number">Next →</span>
        <h3 id="nav-next-title"></h3>
      </a>
    </div>
  </section>

  <!-- ═══════ FOOTER ═══════ -->
  <footer class="site-footer">
    <div class="container">
      <p>Built by <a href="https://github.com/DavideColabove" target="_blank">Davide Colabove</a> · <a href="https://github.com/DavideColabove/uav-software-portfolio" target="_blank">Source on GitHub</a></p>
    </div>
  </footer>

  <button class="back-to-top" aria-label="Back to top">↑</button>

  <!-- Scripts -->
  <script src="js/site-data.js"></script>
  <script src="js/pdf-viewer.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ── Get chapter from URL ──
    const params = new URLSearchParams(window.location.search);
    const chId = params.get('ch');
    const chIdx = SITE_DATA.chapters.findIndex(c => c.id === chId);
    const chapter = SITE_DATA.chapters[chIdx];

    if (!chapter) {
      document.body.innerHTML = '<div style="padding:4rem;text-align:center;color:#94a3b8"><h1>Chapter not found</h1><p><a href="index.html">← Back to Home</a></p></div>';
    } else {
      // ── Fill header ──
      document.title = `Ch.${chapter.number}: ${chapter.shortTitle} — UAV Portfolio`;
      document.getElementById('breadcrumb-title').textContent = `Chapter ${chapter.number}`;
      document.getElementById('chapter-title').textContent = `Chapter ${chapter.number}: ${chapter.title}`;
      document.getElementById('chapter-desc').textContent = chapter.description;

      const statusEl = document.getElementById('chapter-status');
      const statusLabel = chapter.status === 'completed' ? 'Completed' :
                          chapter.status === 'in-progress' ? 'In Progress' : 'Upcoming';
      statusEl.textContent = statusLabel;
      statusEl.classList.add(chapter.status);

      document.getElementById('chapter-branch').innerHTML =
        `🔀 <a href="${REPO_BASE}/tree/${chapter.branch}" target="_blank" style="color:var(--text-muted)">${chapter.branch}</a>`;

      // ── Nav links for chapters ──
      const navLinksEl = document.getElementById('nav-links');
      SITE_DATA.chapters.forEach(c => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `chapter.html?ch=${c.id}`;
        a.textContent = `Ch.${c.number}`;
        if (c.id === chId) a.classList.add('active');
        li.appendChild(a);
        navLinksEl.appendChild(li);
      });

      // ── Load PDF summary (served locally from docs/summaries/) ──
      const summaryPdfUrl = chapter.summaryPdf;  // relative path
      loadPdfViewer(summaryPdfUrl);

      // ── Render deep-dives ──
      const listEl = document.getElementById('deepdive-list');
      if (chapter.deepdives.length === 0) {
        listEl.innerHTML = `
          <div class="pdf-placeholder" style="padding:2rem">
            <p style="color:var(--text-muted)">No deep-dives yet for this chapter. Check back soon!</p>
          </div>`;
      } else {
        chapter.deepdives.forEach((dd, i) => {
          const item = document.createElement('a');
          item.href = blobUrl(dd.pdfPath, chapter.branch);
          item.target = '_blank';
          item.rel = 'noopener noreferrer';
          item.className = 'deepdive-item fade-in';
          item.style.transitionDelay = `${i * 0.1}s`;
          item.innerHTML = `
            <div class="deepdive-icon">
              <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 2.5L18.5 10H13V4.5zM6 20V4h5v7h7v9H6z"/></svg>
            </div>
            <div class="deepdive-info">
              <h4>${dd.title}</h4>
              <p>${dd.subtitle}</p>
            </div>
            <span class="deepdive-arrow">→</span>
          `;
          listEl.appendChild(item);
        });
      }

      // ── Render source files ──
      if (chapter.sourceFiles.length > 0) {
        document.getElementById('source-section').style.display = 'block';
        const srcList = document.getElementById('source-list');
        chapter.sourceFiles.forEach(sf => {
          const item = document.createElement('a');
          item.href = blobUrl(sf.path, chapter.branch);
          item.target = '_blank';
          item.className = 'source-item';
          item.innerHTML = `
            <div class="source-icon">${sf.lang}</div>
            <div class="deepdive-info">
              <h4>${sf.name}</h4>
              <p>${sf.path}</p>
            </div>
            <span class="deepdive-arrow">→</span>
          `;
          srcList.appendChild(item);
        });
      }

      // ── Prev / Next navigation ──
      if (chIdx > 0) {
        const prev = SITE_DATA.chapters[chIdx - 1];
        const prevEl = document.getElementById('nav-prev');
        prevEl.href = `chapter.html?ch=${prev.id}`;
        prevEl.style.display = 'flex';
        document.getElementById('nav-prev-title').textContent = prev.shortTitle;
      }
      if (chIdx < SITE_DATA.chapters.length - 1) {
        const next = SITE_DATA.chapters[chIdx + 1];
        const nextEl = document.getElementById('nav-next');
        nextEl.href = `chapter.html?ch=${next.id}`;
        nextEl.style.display = 'flex';
        document.getElementById('nav-next-title').textContent = next.shortTitle;
      }

      // Re-init animations
      initFadeIn();
    }

    // Download summary helper
    function downloadSummary() {
      if (!chapter) return;
      const a = document.createElement('a');
      a.href = chapter.summaryPdf;
      a.download = `ch${chapter.number}_summary.pdf`;
      a.click();
    }
  </script>
</body>
</html>
